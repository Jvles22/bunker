# Paramètres du nœud bunker_elevation_map_node
# Publie /bunker/elevation_map (grid_map_msgs/GridMap, layer "elevation")

map_frame:    "map"
resolution:   0.20      # m/cell — compromis qualité/perf : 62k cellules, ~1.2 MB/msg (0.25 → 0.15 → 0.20)

# Carte fixe couvrant le carré 25×25 m + les features extérieures
map_length_x: 50.0      # m
map_length_y: 50.0      # m
center_x:     0     # centre du carré de navigation (m)
center_y:     0

# Filtrage vertical : ignore le sol et les points trop hauts (feuillage dense)
min_height: -0.20       # m — inclut légères dépressions Gazebo (terrain à z=-0.01 etc.)
max_height:  1.5       # m — captures troncs (0–1m) + sommet rampe 30° (~1.15m)
                        #     exclut la canopée (démarre à ~1.5m dans cette map)

publish_rate: 1.0       # Hz — suffit pour le costmap (update_freq = 1–2 Hz)

# Décroissance temporelle — cellules non observées depuis N secondes → réinitialisées à NaN.
# Le costmap se dégèle naturellement quand le robot quitte une zone.
decay_time_ground: 1000.0 # s — terrain statique : la carte persiste d'une boucle à l'autre
decay_time_max:    20.0  # s — objets (rapide : obstacles mobiles/disparaissent)

# Filtre self-shadow : les retours Velodyne à moins de cette distance horizontale du capteur
# sont exclus de elevation_max. Élimine les retours du châssis/body du robot (≈0.3–0.8m)
# qui créeraient un faux delta élevé directement sous le robot.
min_range_for_max: 1.0   # m

# Filtre sol (double couche) — exclut obstacles suspendus (canopée, branches)
# Seuls les retours LiDAR dans [z_min_local, z_min_local + ground_filter_height] sont
# accumulés dans elevation_gnd. La canopée et les branches au-dessus du sol de plus de
# ground_filter_height sont exclues → supprime les faux anneaux LETHAL autour des arbres.
ground_filter_height: 0.20  # m — hauteur max au-dessus du minimum local (0.40→0.20 : filtre plus agressif)

# Gaussian Process — interpolation des cellules jamais scannées (élévation NaN)
# Les cellules non visitées reçoivent une estimation pondérée par un noyau Gaussien
# centré sur leurs voisins valides. Publie une couche "elevation_gp" dans le GridMap.
gp_sigma:          0.40  # m — rayon de corrélation (demi-largeur du noyau)
gp_search_radius:  0.80  # m — rayon de recherche des voisins (2× sigma recommandé)
gp_min_neighbors:  3     # nombre minimum de voisins valides avant d'interpoler
