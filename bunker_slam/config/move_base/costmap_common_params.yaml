robot_radius: 0.35

obstacle_layer:
  enabled: true
  observation_sources: velodyne
  velodyne:
    sensor_frame: velodyne
    data_type: PointCloud2
    topic: /velodyne_points
    expected_update_rate: 0.0
    marking: true
    clearing: true
    min_obstacle_height: 0.05
    max_obstacle_height: 1.50
    obstacle_range: 4.0
    raytrace_range: 5.0

traversability_layer:
  enabled: true
  elevation_topic: "/bunker/elevation_map"
  lethal_slope_deg: 25.0
  min_slope_deg: 5.0
  min_hits: 3.0
  preserve_lethal: true
  update_radius: 8.0

inflation_layer:
  enabled: true
  inflation_radius: 0.50
  cost_scaling_factor: 1.5