footprint: [[-0.345, -0.335], [-0.345, 0.335], [0.345, 0.335], [0.345, -0.335]]

obstacle_layer:
  enabled: true
  observation_sources: velodyne
  velodyne:
    sensor_frame: velodyne            # position réelle du capteur pour le raytrace clearing
    data_type: PointCloud2
    topic: /velodyne_points_filtered  # nuage filtré par adaptive_obstacle_filter_node (repère map)
    expected_update_rate: 0.0
    marking: true
    clearing: true
    min_obstacle_height: -10.0        # fenêtre hauteur gérée par le nœud Python
    max_obstacle_height:  10.0
    obstacle_range: 4.0
    raytrace_range: 5.0

traversability_layer:
  enabled: true
  elevation_topic: "/bunker/elevation_map"
  lethal_slope_deg: 40.0   # relevé de 35°→40° pour absorber les spikes de transition rampe→plat
  min_slope_deg: 5.0
  min_hits: 1.0             # 2→1 : troncs fins détectés avec 1 seul retour LiDAR
  preserve_lethal: false
  delta_obstacle_threshold: 0.7   # m — canopée (>0.7m au-dessus du sol) → LETHAL
  update_radius: 8.0
  # Chaque entrée : [seuil_max_deg, coût].  Évalué dans l'ordre — premier match gagne.
  # Les pentes < min_slope_deg (5°) restent transparentes (NO_INFORMATION).
  # Progression quasi-quadratique : la difficulté physique croît plus vite que l'angle.
  # Le check delta n'est appliqué QUE sur terrain plat (slope < min_slope_deg) —
  # sur les cellules de pente connue, seul le coût de pente est utilisé.
  slope_cost_table:
    - [ 8.0,   8]   #  5°– 8° : très légère pente, quasi-plat
    - [11.0,  18]   #  8°–11° : légère pente, coût symbolique
    - [14.0,  30]   # 11°–14° : pente faible, détour envisageable
    - [17.0,  48]   # 14°–17° : pente modérée-faible
    - [20.0,  68]   # 17°–20° : pente modérée, détour préférable
    - [22.0,  90]   # 20°–22° : pente significative
    - [24.0, 120]   # 22°–24° : pente forte
    - [25.0, 160]   # 24°–25°+ : coût max avant létal (identique à l'ancien code)
    # 25°–40° → fallback = dernier élément = 160 (spike de transition passable)
    # ≥ lethal_slope_deg (40°) → LETHAL_OBSTACLE automatique

inflation_layer:
  enabled: true
  inflation_radius: 1.00       # 0.40→1.00 : déviation latérale d'au moins 1m autour des obstacles
  cost_scaling_factor: 2.5