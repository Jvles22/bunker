TebLocalPlannerROS:
  max_vel_x: 0.7
  max_vel_x_backwards: 0.2        # doit être > penalty_epsilon
  penalty_epsilon: 0.04            # < 0.05 (valeur mini utilisée par param_tuner.py)
  max_vel_theta: 1.0
  acc_lim_x: 0.5
  acc_lim_theta: 0.5

  xy_goal_tolerance: 0.5
  yaw_goal_tolerance: 1.5
  free_goal_vel: false

  min_obstacle_dist: 0.05         # réduit de 0.12 → 0.05 pour corridors étroits
  inflation_dist: 0.05
  weight_obstacle: 10.0           # réduit de 20 → 10
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.5
  obstacle_poses_affected: 30

  footprint_model:
    type: "polygon"
    vertices: [[-0.345, -0.335], [-0.345, 0.335], [0.345, 0.335], [0.345, -0.335]]

  enable_homotopy_class_planning: false  # désactivé : 4× plus rapide, évite les boucles "not feasible"
  enable_multithreading: true
  max_number_classes: 1

  global_plan_overwrite_orientation: true
  global_plan_viapoint_sep: 0.5
  max_global_plan_lookahead_dist: 8.0    # était 5.0

  dt_ref: 0.4
  dt_hysteresis: 0.15
  min_samples: 5
  max_samples: 500

  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 10.0  # était 1000.0

  no_inner_iterations: 5
  no_outer_iterations: 4                 # était 3

  odom_topic: /odom
  map_frame: map