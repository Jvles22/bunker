DWAPlannerROS:
  # --- Vitesses (alignées sur TEB) ---
  max_vel_x: 0.7
  min_vel_x: -0.2          # = max_vel_x_backwards TEB
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.7       # = max_vel_x (robot non-holonome)
  min_vel_trans: 0.1
  max_vel_theta: 1.0       # = TEB
  min_vel_theta: 0.0       # 0 = permet vitesse angulaire nulle (pas de rotation forcée)

  # --- Accélérations (alignées sur TEB) ---
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 0.5       # = TEB (était 1.0)

  # --- Tolérance d'arrivée (alignées sur TEB) ---
  xy_goal_tolerance: 0.5   # = TEB (était 1.0)
  yaw_goal_tolerance: 0.2  # = TEB (était 0.5)
  latch_xy_goal_tolerance: false

  # --- Simulation trajectoire ---
  sim_time: 2.5            # horizon légèrement plus long pour anticiper
  sim_granularity: 0.025
  vx_samples: 12           # plus d'échantillons → meilleure trajectoire
  vy_samples: 1
  vth_samples: 24

  # --- Scores ---
  path_distance_bias: 55.0      # 32→55 : suit mieux la droite sur terrain dégagé
  goal_distance_bias: 24.0
  occdist_scale: 0.25            # 0.15→0.25 : plus sensible aux zones de coût élevé
  forward_point_distance: 0.55 # 0.325→0.55 : scoring plus loin devant, préfère aller droit
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # --- Robot différentiel ---
  holonomic_robot: false
