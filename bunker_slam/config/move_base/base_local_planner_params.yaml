DWAPlannerROS:
  # Vitesses
  max_vel_x: 0.4
  min_vel_x: -0.2
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.4
  min_vel_trans: 0.1
  max_vel_theta: 0.8
  min_vel_theta: 0.1

  # Accélérations
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.0

  # Tolérance d'arrivée
  xy_goal_tolerance: 1
  yaw_goal_tolerance: 3.14
  latch_xy_goal_tolerance: false

  # Simulation trajectoire
  sim_time: 2.0
  sim_granularity: 0.025
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20

  # Scores
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.05
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Robot holonome ?
  holonomic_robot: false
