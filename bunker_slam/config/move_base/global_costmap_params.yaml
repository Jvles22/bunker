global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 1.0
  publish_frequency: 0.5
  static_map: false
  rolling_window: false
  # Zone de navigation 25×25 m (0,0)→(25,25), centre (12.5,12.5)
  # Marge étendue pour couvrir le spawn de slopes_simple (-10,-12)
  # Emprise : (−13,−15)→(37,35)   Cellules : (50/0.15)² ≈ 111 111
  width:    40.0
  height:   40.0
  resolution: 0.15
  origin_x: -22.0  # 3 m de marge au-delà du spawn x=-10
  origin_y: -22.0  # 3 m de marge au-delà du spawn y=-12
  transform_tolerance: 1.0
  plugins:
    - {name: obstacle_layer,       type: "costmap_2d::ObstacleLayer"}
    - {name: traversability_layer, type: "bunker_traversability::TraversabilityLayer"}
    - {name: inflation_layer,      type: "costmap_2d::InflationLayer"}
