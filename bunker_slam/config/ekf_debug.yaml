# robot_localization EKF — mode debug navigation (sans LIO-SAM)
#
# Rôle : publier le TF odom→base_footprint à partir de /odom (Gazebo skid_steer_drive).
# En simulation le repère odom == map (map→odom est une identité statique).
#
# En mode 3D (two_d_mode: false) l'EKF fusionne :
#   • /odom           → x, y, yaw         (odométrie roues, précis en 2D)
#   • /ground_truth_odom → z              (pose Gazebo exacte, plugin p3d)
#   • /imu/data       → roll, pitch        (orientation capteur simulé Gazebo)
#
# Pourquoi c'est nécessaire pour les pentes :
#   Avec two_d_mode=true, l'EKF force z=0 et pitch=0 même quand le robot monte
#   la pente. Le TF velodyne→map est alors géométriquement faux → la carte
#   d'élévation accumule des données erronées → faux obstacles (LETHAL) partout.

frequency: 30
sensor_timeout: 0.1
two_d_mode: false    # ← CRITIQUE : false pour pentes, sinon z=0 et pitch=0 sur rampe
publish_tf: true

map_frame:       map
odom_frame:      odom
base_link_frame: base_footprint
world_frame:     odom

# Source 1 : odométrie roues (x, y, yaw uniquement)
odom0: /odom
odom0_config: [true,  true,  false,   # x, y    (précis depuis encodeurs)
               false, false, true,    # yaw     (précis depuis encodeurs)
               false, false, false,   # vx, vy, vz
               false, false, false,   # vroll, vpitch, vyaw
               false, false, false]   # ax, ay, az
odom0_differential: false
odom0_relative: false

# Source 2 : vérité terrain Gazebo → z (plugin p3d dans bunker.urdf.xacro)
# Ne fournit QUE z — x,y,yaw restent exclusivement depuis les encodeurs.
odom1: /ground_truth_odom
odom1_config: [false, false, true,    # z exact depuis physique Gazebo
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_relative: false

# Source 3 : IMU → roll, pitch (orientation 3D correcte sur pente)
imu0: /imu/data
imu0_config: [false, false, false,
              true,  true,  false,    # roll, pitch depuis IMU Gazebo (sans yaw : drift évité)
              false, false, false,
              false, false, false,
              false, false, false]
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: true
