lio_sam:

  # Topics — adaptés au Bunker
  pointCloudTopic: "velodyne_points"    # VLP-16 → 10 Hz
  imuTopic: "imu/data"                  # IMU Gazebo → 200 Hz
  odomTopic: "odometry/imu"
  gpsTopic: "odometry/gpsz"            # non utilisé en simulation

  # Frames
  lidarFrame: "velodyne"
  baselinkFrame: "base_footprint"
  odometryFrame: "odom"
  mapFrame: "map"

  # GPS — désactivé en simulation
  useImuHeadingInitialization: false
  useGpsElevation: false
  gpsCovThreshold: 2.0
  poseCovThreshold: 25.0

  # Export
  savePCD: true
  savePCDDirectory: "/home/jules/bunker_maps/"

  # Capteur — VLP-16
  sensor: velodyne
  N_SCAN: 16
  Horizon_SCAN: 1800
  downsampleRate: 1
  lidarMinRange: 0.9
  lidarMaxRange: 130.0

  # IMU — bruit simulé Gazebo (faible)
  imuAccNoise: 3.9939570888238808e-03
  imuGyrNoise: 1.5636343949698187e-03
  imuAccBiasN: 6.4356659353532566e-05
  imuGyrBiasN: 3.5640318696367613e-05
  imuGravity: 9.81
  imuRPYWeight: 0.01
  imuFrequency: 200

  # Extrinsèques LiDAR→IMU
  # IMU et LiDAR sont tous les deux sur base_link → pas de rotation
  extrinsicTrans: [0.0, 0.0, 0.0]
  extrinsicRot: [1, 0, 0,
                 0, 1, 0,
                 0, 0, 1]
  extrinsicRPY: [1, 0, 0,
                 0, 1, 0,
                 0, 0, 1]

  # Features LOAM
  edgeThreshold: 1.0
  surfThreshold: 0.1
  edgeFeatureMinValidNum: 10
  surfFeatureMinValidNum: 100

  # Voxel filter — outdoor
  odometrySurfLeafSize: 0.4
  mappingCornerLeafSize: 0.2
  mappingSurfLeafSize: 0.4

  # Contraintes mouvement — robot terrestre
  z_tollerance: 0.5
  rotation_tollerance: 1000

  # CPU
  numberOfCores: 4
  mappingProcessInterval: 0.10

  # Carte environnante
  surroundingkeyframeAddingDistThreshold: 1.0
  surroundingkeyframeAddingAngleThreshold: 0.2
  surroundingKeyframeDensity: 2.0
  surroundingKeyframeSearchRadius: 50.0

  # Loop closure
  loopClosureEnableFlag: true
  loopClosureFrequency: 1.0
  surroundingKeyframeSize: 50
  historyKeyframeSearchRadius: 15.0
  historyKeyframeSearchTimeDiff: 30.0
  historyKeyframeSearchNum: 25
  historyKeyframeFitnessScore: 0.3

  # Visualisation
  globalMapVisualizationSearchRadius: 1000.0
  globalMapVisualizationPoseDensity: 10.0
  globalMapVisualizationLeafSize: 1.0
